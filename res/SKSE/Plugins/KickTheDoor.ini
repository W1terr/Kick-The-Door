; Kick the Door - kick doors open or blast them with Unrelenting Force, and kick anyone in the way
; Most of it can be changed in game: SKSE Menu Framework > Kick the Door.
; The menu writes its values back into this file (comments stay).

[General]
bKicking = 1                 ; press the kick key at a door to kick it
bUnrelentingForce = 1        ; Unrelenting Force breaks the first door its wave reaches
bKnockdown = 1               ; actors right behind a door that bursts open are knocked over (staggered if they can't fall)
fOpenSpeed = 1.9             ; a forced door swings open this much faster than normally (1 - 3)
bOpenAwayFromHit = 1         ; a forced door swings away from the hit, whichever way it normally opens
sLanguage = auto             ; menu and messages: auto (the game's), english, french, german, italian, spanish, polish,
                             ; russian, japanese, chinese

[Kick]
iKey = 34                    ; G. Keyboard: DirectInput scan code; mouse: 256 + button; gamepad: 266-281 (SKSE codes); -1 = none
iGamepadKey = -1
fHoldTime = 0                ; seconds the key is held before the kick starts (0 = on press)
fReach = 170                 ; the farthest you can stand from the door
bEnterLoadDoors = 1          ; a load door whose lock you kick in takes you through

[Locks]
; b<Level> = the lock level can be forced at all (kicks and Unrelenting Force)
; f<Level>Stamina = current stamina a kick needs to do anything; f<Level>StaminaCost = what a landed kick takes
; i<Level>ShoutWords = words of Unrelenting Force that break it (1 Fus, 2 Fus Ro, 3 Fus Ro Dah)
; i<Level>Kicks = kicks that must land before it gives (1 - 5; a weakened door stays weakened, saved with the game)
bNovice = 1
fNoviceStamina = 120
fNoviceStaminaCost = 30
iNoviceShoutWords = 1
iNoviceKicks = 1
bApprentice = 1
fApprenticeStamina = 140
fApprenticeStaminaCost = 40
iApprenticeShoutWords = 1
iApprenticeKicks = 1
bAdept = 1
fAdeptStamina = 170
fAdeptStaminaCost = 50
iAdeptShoutWords = 2
iAdeptKicks = 1
bExpert = 1
fExpertStamina = 200
fExpertStaminaCost = 60
iExpertShoutWords = 3
iExpertKicks = 2
bMaster = 1
fMasterStamina = 250
fMasterStaminaCost = 75
iMasterShoutWords = 3
iMasterKicks = 2
; doors that aren't locked (bUnlocked 0 = the kick key does nothing at them)
bUnlocked = 1
fUnlockedStamina = 60
fUnlockedStaminaCost = 15
iUnlockedKicks = 1

[Fight]
bKickPeople = 1              ; the kick key kicks anywhere, straight where you face: whoever it reaches is staggered and
                             ; takes it as an attack
fStaminaCost = 40            ; stamina such a kick takes (with less you can't kick); door kicks take [Locks] costs
fStagger = 0.75              ; stagger strength (the first word of Unrelenting Force: 0.75)
bSprintKnockdown = 1         ; kicked while sprinting, people in light armor or none fall over (heavy armor, big
                             ; creatures and those who can't fall are only staggered)
fSprintKnockdownForce = 4
bDuringAttacks = 1           ; the kick key works mid-swing / mid-combo: the attack stops, a shorter quicker kick plays,
                             ; and attacking after the hit carries on with the combo
fSprintSlide = 120           ; kicking out of a sprint, the run carries you on from your running speed, slowing down
                             ; evenly until a little after the hit: at most this far (units; 0 = stop dead)

[UnrelentingForce]
fMaxDistance = 1500          ; doors farther from the shout than this are out of reach
bUnlockedDoors = 1           ; Unrelenting Force (any number of words) also throws unlocked doors open (needs bUnlocked)
; Shouts whose spells count as Unrelenting Force (word 1, 2, 3 = the shout's variations). "Plugin.esp|0xID" or editor ids,
; comma separated; add the shout of a mod that replaces Unrelenting Force with its own.
Shouts = Skyrim.esm|0x13E07

[Doors]
bQuestDoors = 0              ; also doors held by quests (filled into a quest alias, or a persistent non-load door scripts keep track of)
bCrime = 1                   ; breaking an owned lock is trespassing when someone sees it, as picking it is
bNoise = 1                   ; the crash is loud: actors nearby hear it
fKnockdownForce = 4          ; how hard a door throws someone behind it (0 = stagger instead)
fMinDoorHeight = 100         ; "doors" lower than this (display cases, hatches, trap triggers) are never forced
fBarredDelay = 0.5           ; doors whose model turns locks / slides bars longer than this (s) before it swings (Glorious Doors of
                             ; Skyrim fort and Dwemer doors) are barred: never forced. 0 = force them too
; Door base forms or references never forced / always treated as doors (size check skipped). "Plugin.esp|0xID", comma separated.
Exclude =
Include =

[Feedback]
bMessages = 1                ; notifications: not enough stamina, the door gave a little, the lock needs a key...
bDebugLog = 0                ; details in Documents\My Games\Skyrim Special Edition\SKSE\KickTheDoor.log
